name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            ffmpeg \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libportmidi-dev \
            libswscale-dev \
            libavformat-dev \
            libavcodec-dev \
            zlib1g-dev \
            libffi-dev \
            libssl-dev \
            autoconf \
            automake \
            libtool \
            pkg-config \
            cmake \
            zip \
            unzip

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install https://github.com/kivy/buildozer/archive/master.zip
          pip install cython

      - name: Pre-install Android Command Line Tools & Symlinks
        run: |
          # 1. Crear directorios para el SDK
          SDK_DIR=$HOME/.buildozer/android/platform/android-sdk
          mkdir -p $SDK_DIR/cmdline-tools

          # 2. Descargar e instalar cmdline-tools modernas
          curl -o cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdline-tools.zip
          mv cmdline-tools $SDK_DIR/cmdline-tools/latest
          rm -f cmdline-tools.zip

          # 3. Solución al error: Crear redirección (symlink) de la ruta obsoleta a la ruta moderna
          mkdir -p $SDK_DIR/tools
          ln -s $SDK_DIR/cmdline-tools/latest/bin $SDK_DIR/tools/bin

          # 4. Pre-aceptar licencias del SDK
          mkdir -p $SDK_DIR/licenses
          printf "24333f8a637bba39ea846d273f3091529b8282fd\n89330172875f1fb41130205a1435728362678129\ne6750261060f9915146e676179a4234f2a3b3b28\n84831b9409646a578f447fd3bc02d14d990cc83d\n791244e692b535d863051a9162a9f26373829239\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a637bba39ea846d273f3091529b8282fd" > $SDK_DIR/licenses/android-sdk-license
          printf "84831b9409646a578f447fd3bc02d14d990cc83d" > $SDK_DIR/licenses/android-sdk-preview-license

      - name: Build with Buildozer
        run: |
          buildozer android debug
        env:
          ACCEPT_SDK_LICENSES: 1

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-apk
          path: bin/*.apk