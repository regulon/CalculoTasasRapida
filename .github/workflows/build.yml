name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential libsqlite3-dev zlib1g-dev \
            libncurses5-dev libgdbm-dev libnss3-dev libssl-dev libreadline-dev libffi-dev \
            wget curl llvm libncursesw5-dev xz-utils tk-dev libxml2-dev libxmlsec1-dev \
            liblzma-dev autoconf libtool pkg-config libbz2-dev zip unzip
          pip install --upgrade pip setuptools wheel
          pip install buildozer cython "kivy<3.0.0"

      - name: Auto-accept Android SDK Licenses
        run: |
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          printf "24333f8a637b3749d107399279149cb12d72132a\n84831b9409646a7d8f447f119d492211915014bd\nd975 crystall18f8e815610850f2f3d61168f86" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          printf "84831b9409646a7d8f447f119d492211915014bd" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license

      - name: Build APK with Buildozer
        run: |
          buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: bin/*.apk