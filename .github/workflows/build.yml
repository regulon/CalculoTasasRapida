name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            ffmpeg \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libportmidi-dev \
            libswscale-dev \
            libavformat-dev \
            libavcodec-dev \
            zlib1g-dev \
            libffi-dev \
            libssl-dev \
            autoconf \
            automake \
            libtool \
            pkg-config \
            cmake \
            zip \
            unzip

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install https://github.com/kivy/buildozer/archive/master.zip
          pip install cython

      - name: Setup Android SDK and Legacy Wrapper
        run: |
          SDK_DIR=$HOME/.buildozer/android/platform/android-sdk
          mkdir -p $SDK_DIR/cmdline-tools

          # 1. Instalar cmdline-tools oficiales
          curl -o cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdline-tools.zip
          mv cmdline-tools $SDK_DIR/cmdline-tools/latest
          rm -f cmdline-tools.zip

          # 2. Preinstalar componentes requeridos
          mkdir -p $SDK_DIR/licenses
          yes | $SDK_DIR/cmdline-tools/latest/bin/sdkmanager --sdk_root=$SDK_DIR --licenses || true
          $SDK_DIR/cmdline-tools/latest/bin/sdkmanager --sdk_root=$SDK_DIR "platform-tools" "platforms;android-33" "build-tools;33.0.2"

          # 3. Crear el ejecutable wrapper en tools/bin/sdkmanager
          mkdir -p $SDK_DIR/tools/bin
          cat << 'EOF' > $SDK_DIR/tools/bin/sdkmanager
          #!/bin/bash
          exec $HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=$HOME/.buildozer/android/platform/android-sdk "$@"
          EOF
                    chmod +x $SDK_DIR/tools/bin/sdkmanager

                - name: Build with Buildozer
                  run: |
                    buildozer android debug
                  env:
                    ACCEPT_SDK_LICENSES: 1

                - name: Upload APK Artifact
                  uses: actions/upload-artifact@v4
                  with:
                    name: package-apk
                    path: bin/*.apk